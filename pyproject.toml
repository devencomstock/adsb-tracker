# Tool configuration only; this project is not packaged.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a running PostgreSQL/PostGIS (docker compose up -d); skipped if unreachable"]
