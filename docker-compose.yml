services:
  db:
    image: postgis/postgis:16-3.5
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from the untracked .env
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
